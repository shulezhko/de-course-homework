name: Lesson 17 — Spark Structured Streaming verify

on:
  push:
    branches:
      - feature/hw-lesson-17-streaming
    paths:
      - "lesson-17-stream-processing-2/**"
      - ".github/workflows/lesson-17-verify.yml"
  pull_request:
    paths:
      - "lesson-17-stream-processing-2/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lesson-17-stream-processing-2/homework
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run verify.sh
        run: |
          chmod +x verify.sh
          ./verify.sh tasks 2>&1 | tee /tmp/verify_out.txt

      - name: Dump output on failure
        if: failure()
        run: |
          echo "## verify output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/verify_out.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
